[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-sql_query_review"
version = "0.1.0"
description = "Sql Query Review environment for OpenEnv"
requires-python = ">=3.10"
dependencies  = [
    # Core OpenEnv runtime
    "openenv-core[core]>=0.2.2",
    # HTTP client + LLM for inference script
    "openai>=1.0.0",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
# Server entry point - enables running via: uv run --project . server
# or: python -m sql_query_review.server.app
server = "sql_query_review.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["sql_query_review", "sql_query_review.server"]
package-dir = { "sql_query_review" = ".", "sql_query_review.server" = "server" }